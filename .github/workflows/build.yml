name: Validate and release SquadXO
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (required to publish; optional for a validation preview)'
        type: string
        required: false
      release:
        description: 'Publish a release after validation (main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: squadxo-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' || inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      revision: ${{ steps.package.outputs.revision }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      previous: ${{ steps.package.outputs.previous }}
    services:
      postgres:
        image: postgres:18
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: squadjs
          POSTGRES_USER: squadjs
          POSTGRES_PASSWORD: squadjs-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U squadjs -d squadjs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.8
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MARIADB_DATABASE: squadjs
          MARIADB_ROOT_PASSWORD: squadjs-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_POSTGRES_URL: postgres://squadjs:squadjs-test-only@127.0.0.1:5432/squadjs
      DB_TEST_MARIADB_URL: mariadb://root:squadjs-test-only@127.0.0.1:3306/squadjs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/package-validation
        id: package
        with:
          full-tests: 'true'
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/package-validation
        with:
          full-tests: 'false'
  release:
    if: github.repository == 'vohk/SquadXO' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@v8
        if: needs.validate.outputs.revision != github.sha
        with:
          name: validated-release-source
          path: ${{ runner.temp }}/validated-source
      - name: Restore the exact validated release commit
        if: needs.validate.outputs.revision != github.sha
        env:
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          git fetch "$RUNNER_TEMP/validated-source/release-source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_REVISION"
          git checkout --detach "$RELEASE_REVISION"
      - uses: actions/download-artifact@v8
        with:
          name: squadxo-${{ needs.validate.outputs.version }}
          path: release-assets
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: vohk/SquadXO
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
          BASE_REVISION: ${{ github.sha }}
          WEB_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          (cd release-assets && sha256sum --check "squadxo-$RELEASE_VERSION.tar.gz.sha256")
          gh auth setup-git
          node scripts/publish-release.mjs
