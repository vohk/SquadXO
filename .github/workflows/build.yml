name: Validate and release SquadXO
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (required when publishing)'
        type: string
        required: false
      release:
        description: 'Publish a release after validation (main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: squadxo-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: squadjs
          POSTGRES_USER: squadjs
          POSTGRES_PASSWORD: squadjs-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U squadjs -d squadjs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: squadjs
          MARIADB_ROOT_PASSWORD: squadjs-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_POSTGRES_URL: postgres://squadjs:squadjs-test-only@127.0.0.1:5432/squadjs
      DB_TEST_MARIADB_URL: mariadb://root:squadjs-test-only@127.0.0.1:3306/squadjs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - name: Prepare web release version
        if: github.event_name == 'workflow_dispatch'
        env:
          WEB_RELEASE: ${{ inputs.release }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$WEB_RELEASE" = true ]; then
            test "$REPOSITORY" = vohk/SquadXO
            test "$REF" = refs/heads/main
            node scripts/prepare-web-release.mjs "$REQUESTED_VERSION"
          elif [ -n "$REQUESTED_VERSION" ]; then
            echo 'A version input requires the release option; validation-only runs use the checked-out version.' >&2
            exit 1
          fi
      - name: Validate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/release-version.mjs "$TAG"
          else
            VERSION=$(node --input-type=module -e "import p from './package.json' with {type:'json'}; console.log('v'+p.version)")
            node scripts/release-version.mjs "$VERSION"
          fi
      - name: Verify npm toolchain
        run: test "$(npm --version)" = 11.16.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Package validated source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:production -- --version "$RELEASE_VERSION"
      - name: Smoke test extracted production package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
        run: node scripts/smoke-production-package.mjs "artifacts/squadxo-$RELEASE_VERSION.tar.gz" "$RELEASE_VERSION" "$RELEASE_REVISION"
      - uses: actions/upload-artifact@v7
        with:
          name: squadxo-${{ steps.version.outputs.version }}
          path: |
            artifacts/squadxo-${{ steps.version.outputs.version }}.tar.gz
            artifacts/squadxo-${{ steps.version.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
      - name: Preserve validated release commit
        if: github.event_name == 'workflow_dispatch' && inputs.release && steps.version.outputs.revision != github.sha
        run: git bundle create "$RUNNER_TEMP/release-source.bundle" HEAD --not "${{ github.sha }}"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.release && steps.version.outputs.revision != github.sha
        with:
          name: validated-release-source
          path: ${{ runner.temp }}/release-source.bundle
          if-no-files-found: error
  release:
    if: github.repository == 'vohk/SquadXO' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.revision != github.sha
        with:
          name: validated-release-source
          path: ${{ runner.temp }}/validated-source
      - name: Restore validated revision
        if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.revision != github.sha
        env:
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          git fetch "$RUNNER_TEMP/validated-source/release-source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_REVISION"
          git checkout --detach "$RELEASE_REVISION"
      - uses: actions/download-artifact@v8
        with:
          name: squadxo-${{ needs.validate.outputs.version }}
          path: release-assets
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: vohk/SquadXO
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
          BASE_REVISION: ${{ github.sha }}
          WEB_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          (cd release-assets && sha256sum --check "squadxo-$RELEASE_VERSION.tar.gz.sha256")
          gh auth setup-git
          node scripts/publish-release.mjs
