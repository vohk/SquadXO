name: Validate deployment package
description: Validate version, package and smoke the exact source used for publication or preview.
inputs:
  full-tests:
    description: Run the complete test suite; publishing jobs always pass true.
    required: true
outputs:
  version:
    description: Validated release version.
    value: ${{ steps.version.outputs.version }}
  revision:
    description: Exact validated source revision.
    value: ${{ steps.version.outputs.revision }}
  prerelease:
    description: Whether the version is a prerelease.
    value: ${{ steps.version.outputs.prerelease }}
  previous:
    description: Previous stable release tag.
    value: ${{ steps.baseline.outputs.previous }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24.18.0
        cache: npm
    - name: Prepare web release version
      if: github.event_name == 'workflow_dispatch'
      env:
        WEB_RELEASE: ${{ github.event.inputs.release }}
        REQUESTED_VERSION: ${{ github.event.inputs.version }}
        REF: ${{ github.ref }}
        REPOSITORY: ${{ github.repository }}
      shell: bash
      run: |
        if [ "$WEB_RELEASE" = true ]; then
          test "$REPOSITORY" = vohk/SquadXO
          test "$REF" = refs/heads/main
          test -n "$REQUESTED_VERSION" || { echo 'A release requires a version.' >&2; exit 1; }
        fi
        if [ -n "$REQUESTED_VERSION" ]; then
          node scripts/prepare-web-release.mjs "$REQUESTED_VERSION"
        fi
    - name: Validate version
      id: version
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.ref_name }}
      shell: bash
      run: |
        if [ "$EVENT" = push ]; then
          node scripts/release-version.mjs "$TAG"
        else
          VERSION=$(node --input-type=module -e "import p from './package.json' with {type:'json'}; console.log('v'+p.version)")
          node scripts/release-version.mjs "$VERSION"
        fi
    - name: Pin previous stable release for generated notes
      id: baseline
      if: github.repository == 'vohk/SquadXO'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: vohk/SquadXO
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: node scripts/release-baseline.mjs
    - name: Verify npm toolchain
      shell: bash
      run: test "$(npm --version)" = 11.16.0
    - run: npm ci
      shell: bash
    - run: npm run lint
      shell: bash
    - run: npm test
      shell: bash
      if: inputs.full-tests == 'true'
    - name: Package validated source
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: npm run package:production -- --version "$RELEASE_VERSION"
    - name: Smoke test extracted production package
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RELEASE_REVISION: ${{ steps.version.outputs.revision }}
      shell: bash
      run: node scripts/smoke-production-package.mjs "artifacts/squadxo-$RELEASE_VERSION.tar.gz" "$RELEASE_VERSION" "$RELEASE_REVISION"
    - uses: actions/upload-artifact@v7
      with:
        name: squadxo-${{ steps.version.outputs.version }}
        path: |
          artifacts/squadxo-${{ steps.version.outputs.version }}.tar.gz
          artifacts/squadxo-${{ steps.version.outputs.version }}.tar.gz.sha256
        if-no-files-found: error
    - name: Preserve validated release commit
      if: github.event_name == 'workflow_dispatch' && steps.version.outputs.revision != github.sha
      shell: bash
      run: git bundle create "$RUNNER_TEMP/release-source.bundle" HEAD --not "${{ github.sha }}"
    - uses: actions/upload-artifact@v7
      if: github.event_name == 'workflow_dispatch' && steps.version.outputs.revision != github.sha
      with:
        name: validated-release-source
        path: ${{ runner.temp }}/release-source.bundle
        if-no-files-found: error
